<!DOCTYPE html>
<html>
<head>
  <title>TA Access Review Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 32px;
      width: 420px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 15px;
    }
    button {
      background: #b3a369;
      border: none;
      color: white;
      cursor: pointer;
    }
    .small {
      font-size: 12px;
      color: #666;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Teaching Assistant Access Review</h2>
    <p>Your instructional access requires confirmation before grading tools remain enabled.</p>

    <input type="text" placeholder="GT username">
    <input type="password" placeholder="Password">

    <button onclick="showTraining()">Sign In</button>

    <p class="small">Simulation page for cybersecurity awareness training. No credentials are collected.</p>
  </div>

  <script>
    function showTraining() {
      document.body.innerHTML = `
        <div class="card">
          <h2>Phishing Simulation Complete</h2>
          <p>This was a mock phishing landing page.</p>
          <p><strong>Red flags:</strong></p>
          <ul>
            <li>Unexpected login request</li>
            <li>Urgent access deadline</li>
            <li>Generic administrative language</li>
            <li>Link should always be verified before entering credentials</li>
          </ul>
          <p>No credentials were collected or transmitted.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
